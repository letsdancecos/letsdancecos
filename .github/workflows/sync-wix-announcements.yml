name: Sync Wix studio announcements

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: wix-announcements
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Wix RSS importer
        run: python scripts/sync_wix_announcements.py --self-test
      - name: Import published announcements
        run: python scripts/sync_wix_announcements.py
      - name: Commit changes only when announcements changed
        shell: bash
        run: |
          if git diff --quiet -- app/announcements.json; then
            echo "No announcement changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/announcements.json
          git commit -m "Sync published Wix studio announcements"
          git push
