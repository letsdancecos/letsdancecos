name: Sync studio announcements
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/announcements.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: studio-announcements
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test importer
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Import public Wix RSS
        run: python3 scripts/sync_announcements.py
      - name: Prepare durable alert ledger
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python3 scripts/send_announcements.py prepare
      - name: Commit changes and request Pages rebuild
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- app/announcements.json scripts/announcement_push_state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/announcements.json scripts/announcement_push_state.json
            git commit -m 'Update public studio announcements from Wix RSS'
            git push origin HEAD:main
          fi
          # Explicit request: GITHUB_TOKEN commits do not trigger Pages builds.
          # Also retry deployment on unchanged runs after a prior build failure.
          gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Send alerts after public feed is deployed
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python3 scripts/send_announcements.py send
      - name: Preserve alert results even after partial failure
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: |
          if ! git diff --quiet -- scripts/announcement_push_state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/announcement_push_state.json
            git commit -m 'Record studio announcement alert results'
            git push origin HEAD:main
          fi
