name: Sync studio announcements
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/announcements.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: studio-announcements
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test importer
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Import public Wix RSS
        run: python3 scripts/sync_announcements.py
      - name: Commit changes and request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- app/announcements.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/announcements.json
            git commit -m 'Update public studio announcements from Wix RSS'
            git push origin HEAD:main
          fi
          # Explicit request: GITHUB_TOKEN commits do not trigger Pages builds.
          # Also retry deployment on unchanged runs after a prior build failure.
          gh api --method POST repos/${{ github.repository }}/pages/builds
