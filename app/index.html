<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#632b82"><title>Let's Dance Studios App Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f3fb;color:#32233e;font:16px system-ui,Arial,sans-serif}header{background:linear-gradient(120deg,#5b257b,#9250a8);color:white;padding:30px 20px;text-align:center}header h1{margin:0;font-size:30px}header p{margin:8px 0 0}nav{display:flex;overflow:auto;background:white;box-shadow:0 2px 8px #0001;justify-content:center}nav button{border:0;background:white;padding:15px 13px;color:#58316b;font-weight:700;cursor:pointer;white-space:nowrap}nav button[aria-selected=true]{border-bottom:3px solid #7d369c;background:#f6ecfa}main{max-width:800px;margin:24px auto;padding:0 16px 70px}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 18px #482c5415;margin-bottom:16px}.panel h2{margin-top:0;color:#632b82}.pill{display:inline-block;padding:8px 12px;border-radius:30px;background:#f1e1f8;margin:4px;color:#58256d}a.button{display:inline-block;padding:12px 17px;border-radius:10px;background:#632b82;color:white;text-decoration:none}.note{font-size:14px;color:#6d6272}footer{text-align:center;color:#6d6272;padding:15px}@media(max-width:600px){nav{justify-content:flex-start}header h1{font-size:25px}}
 .filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.filters button{border:1px solid #d6b9e4;background:#fff;color:#632b82;border-radius:30px;padding:9px 13px;cursor:pointer}.filters button[aria-pressed=true]{background:#632b82;color:white}.class-card{padding:13px 0;border-top:1px solid #eee}.class-card h3{margin:0 0 4px;color:#632b82}.class-card p{margin:0;color:#6d6272;font-size:14px}</style></head><body><header><h1>Let's Dance Studios</h1><p>Dance • Grow • Shine</p></header><nav aria-label="App sections"><button aria-selected="true" data-tab="home">Home</button><button aria-selected="false" data-tab="classes">Classes</button><button aria-selected="false" data-tab="register">Registration</button><button aria-selected="false" data-tab="events">Events</button><button aria-selected="false" data-tab="parents">Parents</button></nav><main id="content" aria-live="polite"></main><footer>Let's Dance Studios • Preview version</footer><script>
const pages={
home:`<section class="panel"><h2>Welcome to Let's Dance!</h2><p>Discover the joy of dance in Colorado Springs. This is an early preview of our future parent and student app.</p><a class="button" href="https://letsdancecos.com">Visit our website</a></section><section class="panel"><h2>Coming soon</h2><p>Class information, studio updates, and a convenient parent portal.</p></section>`,
classes:`<section class="panel"><h2>Find your dance class</h2><p>Explore our programs. Select an age group to see class options.</p><div class="filters" role="group" aria-label="Filter classes"><button type="button" data-filter="all" aria-pressed="true">All classes</button><button type="button" data-filter="little" aria-pressed="false">Ages 2–5</button><button type="button" data-filter="school" aria-pressed="false">School-age</button><button type="button" data-filter="adult" aria-pressed="false">Adults</button></div><div id="class-results"></div><p class="note">Age groupings are a browsing guide, not confirmed placement requirements. Contact the studio for availability and class times.</p><a class="button" href="https://letsdancecos.com">Ask about enrollment</a></section>`,
register:`<section class="panel"><h2>Registration</h2><p>Online registration is planned. Until it's ready, please contact the studio through its website.</p><a class="button" href="https://letsdancecos.com">Contact the studio</a></section>`,
events:`<section class="panel"><h2>Studio events</h2><p>Recital dates, holiday closures, and announcements will appear here after they're confirmed.</p></section>`,
parents:`<section class="panel"><h2>Parent portal</h2><p>Future features: secure sign-in, student information, attendance, and tuition management.</p><p class="note">No student data or payment information is collected in this preview.</p></section>`};
const content=document.getElementById('content');const classList=[{name:"Intro to Dance",group:"little",desc:"An introduction to movement and dance."},{name:"Tiny Tumble / Tap",group:"little",desc:"Early movement, tumbling and tap."},{name:"Pre-Ballet / Pre-Tap",group:"little",desc:"Foundational ballet and tap."},{name:"Pre-Jazz / Pre-Tap",group:"little",desc:"Foundational jazz and tap."},{name:"Beginning Ballet / Tap",group:"school",desc:"Beginning ballet and tap."},{name:"Adult Ballet",group:"adult",desc:"Adult ballet classes."},{name:"Adult Tap",group:"adult",desc:"Adult tap classes."},{name:"Adult Lyrical",group:"adult",desc:"Adult lyrical dance."},{name:"Adult Pointe",group:"adult",desc:"Adult pointe classes; ask about prerequisites."}];function renderClasses(filter){const out=document.getElementById('class-results');if(!out)return;out.innerHTML=classList.filter(c=>filter==='all'||c.group===filter).map(c=>'<div class="class-card"><h3>'+c.name+'</h3><p>'+c.desc+'</p></div>').join('');document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)))}function show(tab){content.innerHTML=pages[tab]||pages.home;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));if(tab==='classes'){renderClasses('all');document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>renderClasses(b.dataset.filter)))}}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));show('home');
</script></body></html>
