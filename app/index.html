<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#632b82"><title>Let's Dance Studios App Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f3fb;color:#32233e;font:16px system-ui,Arial,sans-serif}header{background:linear-gradient(120deg,#5b257b,#9250a8);color:white;padding:30px 20px;text-align:center}header h1{margin:0;font-size:30px}header p{margin:8px 0 0}nav{display:flex;overflow:auto;background:white;box-shadow:0 2px 8px #0001;justify-content:center}nav button{border:0;background:white;padding:15px 13px;color:#58316b;font-weight:700;cursor:pointer;white-space:nowrap}nav button[aria-selected=true]{border-bottom:3px solid #7d369c;background:#f6ecfa}main{max-width:800px;margin:24px auto;padding:0 16px 70px}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 18px #482c5415;margin-bottom:16px}.panel h2{margin-top:0;color:#632b82}.pill{display:inline-block;padding:8px 12px;border-radius:30px;background:#f1e1f8;margin:4px;color:#58256d}a.button{display:inline-block;padding:12px 17px;border-radius:10px;background:#632b82;color:white;text-decoration:none}.note{font-size:14px;color:#6d6272}footer{text-align:center;color:#6d6272;padding:15px}@media(max-width:600px){nav{justify-content:flex-start}header h1{font-size:25px}}
 .filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.filters button{border:1px solid #d6b9e4;background:#fff;color:#632b82;border-radius:30px;padding:9px 13px;cursor:pointer}.filters button[aria-pressed=true]{background:#632b82;color:white}.class-card{padding:13px 0;border-top:1px solid #eee}.class-card h3{margin:0 0 4px;color:#632b82}.class-card p{margin:0;color:#6d6272;font-size:14px}.demo-banner{background:#f2e7f8;border-radius:9px;padding:10px;margin:16px 0;color:#592976;font-weight:700;font-size:13px}.panel label{display:block;margin:16px 0 6px;font-weight:650}.panel select{width:100%;padding:12px;border:1px solid #bcaac6;border-radius:10px;background:#fff;color:#32233e;font:inherit}.panel select:disabled{background:#eee}.primary-btn{background:#632b82;color:#fff;font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px 18px;margin-top:22px;cursor:pointer}.reg-success{margin-top:20px;border:1px solid #d3b9e4;background:#fbf6ff;padding:16px;border-radius:12px}.reg-success h3{margin:0 0 8px;color:#632b82}.panel input,.panel textarea{width:100%;display:block;padding:12px;border:1px solid #bcaac6;border-radius:10px;font:inherit}.event-item{border:1px solid #e8d9ef;border-radius:12px;padding:15px;margin:12px 0}.event-item h3{color:#632b82;margin:6px 0}.event-item p{white-space:pre-wrap}.event-label{font-size:13px;color:#79538a;font-weight:bold}.event-remove{border:1px solid #bcaac6;border-radius:8px;padding:7px;background:white;color:#632b82;cursor:pointer}.panel [hidden]{display:none}.sample-info{background:#fbf7fd;padding:18px;border-radius:12px;margin:14px 0}.sample-info h3{color:#632b82;margin:0 0 8px}.home-hero{background:linear-gradient(135deg,#57216f 0%,#9b5ab0 100%);color:white;border-radius:18px;padding:34px 28px;margin-bottom:16px;box-shadow:0 10px 24px #60278033}.home-hero h2{font-size:clamp(25px,5vw,36px);line-height:1.16;margin:10px 0}.home-hero p{line-height:1.6;max-width:490px;color:#f8edff}.home-eyebrow{letter-spacing:.11em;font-size:11px;font-weight:800;color:#f6d7ff}.home-hero-action{background:white;color:#602780;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:750;cursor:pointer;margin-top:8px}.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.home-tile{display:flex;flex-direction:column;text-align:left;align-items:flex-start;gap:5px;border:1px solid #e8d8ed;border-radius:14px;background:#fcf9ff;padding:17px;cursor:pointer;color:#3b2445;font:inherit;transition:transform .15s,box-shadow .15s}.home-tile:hover{box-shadow:0 4px 12px #4e15541c;transform:translateY(-2px)}.home-tile:focus-visible,.home-hero-action:focus-visible,.home-text-button:focus-visible{outline:3px solid #c28cdb;outline-offset:2px}.home-tile-icon{font-size:25px;margin-bottom:5px}.home-tile strong{color:#632b82}.home-tile small{color:#736279;font-size:13px}.home-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.home-heading h2{margin:0}.home-text-button{border:0;background:transparent;color:#632b82;font:inherit;font-size:14px;font-weight:750;cursor:pointer;white-space:nowrap}.home-preview-event{border-top:1px solid #eee5f2;padding:13px 0}.home-preview-event strong{display:block;color:#632b82;margin:5px 0}.home-preview-event small{color:#755583}.home-empty{color:#716278;margin:12px 0 4px;font-size:14px}@media(max-width:380px){.home-grid{grid-template-columns:1fr}.home-hero{padding:24px 20px}}</style></head><body><header><h1>Let's Dance Studios</h1><p>Dance • Grow • Shine</p></header><nav aria-label="App sections"><button aria-selected="true" data-tab="home">Home</button><button aria-selected="false" data-tab="classes">Classes</button><button aria-selected="false" data-tab="register">Registration</button><button aria-selected="false" data-tab="events">Events</button><button aria-selected="false" data-tab="parents">Parents</button></nav><main id="content" aria-live="polite"></main><footer>Let's Dance Studios • Preview version</footer><script>
const pages={
home:`<section class="home-hero"><span class="home-eyebrow">WELCOME TO LET'S DANCE STUDIOS</span><h2>Every dancer starts somewhere. ✨</h2><p>Explore classes, get studio updates, and find everything you need in one place.</p><button type="button" class="home-hero-action" data-go="classes">Explore classes →</button></section><section class="panel"><h2>Your studio, one tap away</h2><div class="home-grid"><button type="button" class="home-tile" data-go="classes"><span class="home-tile-icon">🩰</span><strong>Dance Classes</strong><small>Find the right fit</small></button><button type="button" class="home-tile" data-go="register"><span class="home-tile-icon">📝</span><strong>Registration</strong><small>Try enrollment</small></button><button type="button" class="home-tile" data-go="events"><span class="home-tile-icon">📅</span><strong>Studio Events</strong><small>Dates & updates</small></button><button type="button" class="home-tile" data-go="parents"><span class="home-tile-icon">⭐</span><strong>Parent Portal</strong><small>Sample dashboard</small></button></div></section><section class="panel"><div class="home-heading"><h2>Latest studio updates</h2><button type="button" data-go="events" class="home-text-button">View all →</button></div><div class="demo-banner">PREVIEW · Demo announcements are visible only in this browser</div><div id="home-events" aria-live="polite"></div></section><section class="panel"><h2>Ready to dance?</h2><p>We welcome dancers ages 2 through adult in Colorado Springs.</p><a class="button" href="https://letsdancecos.com">Visit our studio website ↗</a></section>`,
classes:`<section class="panel"><h2>Find your dance class</h2><p>Explore our programs. Select an age group to see class options.</p><div class="filters" role="group" aria-label="Filter classes"><button type="button" data-filter="all" aria-pressed="true">All classes</button><button type="button" data-filter="little" aria-pressed="false">Ages 2–5</button><button type="button" data-filter="school" aria-pressed="false">School-age</button><button type="button" data-filter="adult" aria-pressed="false">Adults</button></div><div id="class-results"></div><p class="note">Age groupings are a browsing guide, not confirmed placement requirements. Contact the studio for availability and class times.</p><a class="button" href="https://letsdancecos.com">Ask about enrollment</a></section>`,
register:`<section class="panel"><h2>Find your next class</h2><p>Try our registration preview to see how enrollment will work.</p><div class="demo-banner">DEMO ONLY · Nothing is submitted or saved</div><form id="interest-form"><label for="reg-age">Dancer's age group</label><select id="reg-age" required><option value="">Choose an age group</option><option value="little">Ages 2–5</option><option value="school">School-age</option><option value="adult">Adult</option></select><label for="reg-class">Class you're interested in</label><select id="reg-class" required disabled><option value="">Select an age group first</option></select><label for="reg-goal">What are you looking for?</label><select id="reg-goal"><option>Just exploring classes</option><option>Ready to enroll</option><option>Would like more information</option></select><button class="primary-btn" type="submit">Preview next step →</button></form><div id="reg-result" aria-live="polite"></div></section>`,
events:`<section class="panel"><h2>Events & Announcements</h2><p>Browse recital reminders, closures and studio news.</p><div class="demo-banner">DEMO ONLY: Announcements you add remain in your browser, not published to parents.</div><div class="filters"><button type="button" data-event-filter="all">All</button><button type="button" data-event-filter="recital">Recitals</button><button type="button" data-event-filter="closure">Closures</button><button type="button" data-event-filter="news">News</button></div><div id="event-list" aria-live="polite"></div></section><section class="panel"><h2>Try adding an announcement</h2><p class="note">Test editor only, not a secure staff portal. Do not enter student information.</p><form id="event-form"><label for="event-title">Announcement title</label><input id="event-title" required maxlength="90" placeholder="e.g. Recital rehearsal"><label for="event-category">Category</label><select id="event-category"><option value="recital">Recital</option><option value="closure">Closure</option><option value="news">Studio news</option></select><label for="event-date">Date (optional)</label><input id="event-date" type="date"><label for="event-details">Details</label><textarea id="event-details" maxlength="400" rows="3" placeholder="A few details"></textarea><button class="primary-btn" type="submit">Add demo announcement</button></form><p id="event-feedback" class="note" role="status"></p></section>`,
parents:`<section class="panel"><h2>Parent Portal</h2><div class="demo-banner">SAMPLE ACCOUNT ONLY · No real student records or payments</div><p>See what families could access in their own secure dashboard.</p><button type="button" class="primary-btn" id="sample-open">Open sample student dashboard</button></section><section class="panel" id="sample-panel" hidden><h2>⭐ Demo Dancer</h2><p class="note">Fictional student profile</p><div class="filters"><button type="button" data-parent-section="classes">Classes</button><button type="button" data-parent-section="attendance">Attendance</button><button type="button" data-parent-section="tuition">Tuition</button></div><div id="sample-detail" aria-live="polite"></div><button type="button" class="event-remove" id="sample-close">Close dashboard</button></section>`};
const content=document.getElementById('content');const classList=[{name:"Intro to Dance",group:"little",desc:"An introduction to movement and dance."},{name:"Tiny Tumble / Tap",group:"little",desc:"Early movement, tumbling and tap."},{name:"Pre-Ballet / Pre-Tap",group:"little",desc:"Foundational ballet and tap."},{name:"Pre-Jazz / Pre-Tap",group:"little",desc:"Foundational jazz and tap."},{name:"Beginning Ballet / Tap",group:"school",desc:"Beginning ballet and tap."},{name:"Adult Ballet",group:"adult",desc:"Adult ballet classes."},{name:"Adult Tap",group:"adult",desc:"Adult tap classes."},{name:"Adult Lyrical",group:"adult",desc:"Adult lyrical dance."},{name:"Adult Pointe",group:"adult",desc:"Adult pointe classes; ask about prerequisites."}];function renderClasses(filter){const out=document.getElementById('class-results');if(!out)return;out.innerHTML=classList.filter(c=>filter==='all'||c.group===filter).map(c=>'<div class="class-card"><h3>'+c.name+'</h3><p>'+c.desc+'</p></div>').join('');document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)))}function setupRegistration(){const age=document.getElementById('reg-age'),cl=document.getElementById('reg-class'),result=document.getElementById('reg-result');age.addEventListener('change',()=>{const options=classList.filter(c=>c.group===age.value);cl.disabled=!options.length;cl.replaceChildren(new Option(options.length?'Choose a class':'Select an age group first',''),...options.map(c=>new Option(c.name,c.name)));result.replaceChildren()});document.getElementById('interest-form').addEventListener('submit',e=>{e.preventDefault();if(!age.value||!cl.value)return;result.replaceChildren();const box=document.createElement('div');box.className='reg-success';const h=document.createElement('h3');h.textContent='Enrollment preview';const p=document.createElement('p');p.textContent='You selected '+cl.value+'. In the finished app, parents will be able to send an enrollment request securely. For now, contact the studio using the link below.';const link=document.createElement('a');link.className='button';link.href='https://letsdancecos.com';link.textContent='Visit studio website';box.append(h,p,link);result.append(box)})}const eventKey="letsdance_demo_announcements_v1";let demoEvents=[];try{const saved=JSON.parse(localStorage.getItem(eventKey)||"[]");if(Array.isArray(saved))demoEvents=saved.filter(x=>x&&typeof x.title==="string").slice(0,40)}catch(e){}let eventFilter="all";function storeEvents(){try{localStorage.setItem(eventKey,JSON.stringify(demoEvents));return true}catch(e){return false}}function paintEvents(){const root=document.getElementById("event-list");if(!root)return;root.replaceChildren();document.querySelectorAll("[data-event-filter]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.eventFilter===eventFilter)));const items=demoEvents.filter(x=>eventFilter==="all"||x.category===eventFilter).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));if(!items.length){const p=document.createElement("p");p.className="note";p.textContent="No demo announcements here yet. Add one below.";root.append(p)}for(const item of items){const card=document.createElement("article");card.className="event-item";const label=document.createElement("div");label.className="event-label";label.textContent=({recital:"Recital",closure:"Closure",news:"Studio news"}[item.category]||"Studio news")+" · "+(item.date||"Date to be announced");const h=document.createElement("h3");h.textContent=item.title;const p=document.createElement("p");p.textContent=item.details||"Details coming soon";const b=document.createElement("button");b.type="button";b.className="event-remove";b.textContent="Remove demo entry";b.addEventListener("click",()=>{demoEvents=demoEvents.filter(x=>x.id!==item.id);storeEvents();paintEvents()});card.append(label,h,p,b);root.append(card)}}function setupEvents(){eventFilter="all";paintEvents();document.querySelectorAll("[data-event-filter]").forEach(b=>b.addEventListener("click",()=>{eventFilter=b.dataset.eventFilter;paintEvents()}));document.getElementById("event-form").addEventListener("submit",e=>{e.preventDefault();const title=document.getElementById("event-title").value.trim(),category=document.getElementById("event-category").value,date=document.getElementById("event-date").value,details=document.getElementById("event-details").value.trim();if(!title)return;demoEvents.push({id:String(Date.now())+Math.random(),title:title.slice(0,90),category,date,details:details.slice(0,400)});const saved=storeEvents();eventFilter="all";paintEvents();e.target.reset();document.getElementById("event-feedback").textContent=saved?"Saved on this browser only.":"Added for this session only (browser storage unavailable)."})}const sampleViews={classes:"<h3>Class enrollment</h3><p>Pre-Ballet / Pre-Tap (sample)</p><p>Schedule: Contact studio to confirm</p>",attendance:"<h3>Attendance</h3><p>3 of 4 classes attended (sample)</p><p>✓ Present · ✓ Present · Absent · ✓ Present</p>",tuition:"<h3>Tuition</h3><p>Example invoice status: Paid</p><p>No real invoices, cards, or balances are connected.</p>"};function setupParentDemo(){const panel=document.getElementById("sample-panel");const detail=document.getElementById("sample-detail");function select(name){detail.innerHTML="<div class=\"sample-info\">"+sampleViews[name]+"</div>";document.querySelectorAll("[data-parent-section]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.parentSection===name)))}document.getElementById("sample-open").addEventListener("click",()=>{panel.hidden=false;select("classes");panel.scrollIntoView({block:"start",behavior:"smooth"})});document.getElementById("sample-close").addEventListener("click",()=>{panel.hidden=true});document.querySelectorAll("[data-parent-section]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.parentSection)))}function setupHome(){document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.go)));const root=document.getElementById("home-events");if(!root)return;root.replaceChildren();const future=demoEvents.filter(e=>e&&typeof e.title==="string"&&["recital","closure","news"].includes(e.category)).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")).slice(0,3);if(!future.length){const p=document.createElement("p");p.className="home-empty";p.textContent="No demo announcements yet. Try adding one in Events, then come back here.";root.append(p);return}for(const e of future){const card=document.createElement("article");card.className="home-preview-event";const meta=document.createElement("small");meta.textContent=({recital:"Recital",closure:"Closure",news:"Studio news"}[e.category]||"News")+" · "+(e.date||"Date TBD");const title=document.createElement("strong");title.textContent=e.title.slice(0,90);const desc=document.createElement("p");desc.className="note";desc.textContent=(e.details||"Details coming soon").slice(0,140);card.append(meta,title,desc);root.append(card)}}function show(tab){content.innerHTML=pages[tab]||pages.home;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));if(tab==='classes'){renderClasses('all');document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>renderClasses(b.dataset.filter)))}if(tab==='home')setupHome();if(tab==='register')setupRegistration();if(tab==='events')setupEvents();if(tab==='parents')setupParentDemo()}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));show('home');
</script></body></html>
