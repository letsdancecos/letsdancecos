<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#632b82"><title>Let's Dance Studios App Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f3fb;color:#32233e;font:16px system-ui,Arial,sans-serif}header{background:linear-gradient(120deg,#5b257b,#9250a8);color:white;padding:30px 20px;text-align:center}header h1{margin:0;font-size:30px}header p{margin:8px 0 0}nav{display:flex;overflow:auto;background:white;box-shadow:0 2px 8px #0001;justify-content:center}nav button{border:0;background:white;padding:15px 13px;color:#58316b;font-weight:700;cursor:pointer;white-space:nowrap}nav button[aria-selected=true]{border-bottom:3px solid #7d369c;background:#f6ecfa}main{max-width:800px;margin:24px auto;padding:0 16px 70px}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 18px #482c5415;margin-bottom:16px}.panel h2{margin-top:0;color:#632b82}.pill{display:inline-block;padding:8px 12px;border-radius:30px;background:#f1e1f8;margin:4px;color:#58256d}a.button{display:inline-block;padding:12px 17px;border-radius:10px;background:#632b82;color:white;text-decoration:none}.note{font-size:14px;color:#6d6272}footer{text-align:center;color:#6d6272;padding:15px}@media(max-width:600px){nav{justify-content:flex-start}header h1{font-size:25px}}
</style></head><body><header><h1>Let's Dance Studios</h1><p>Dance • Grow • Shine</p></header><nav aria-label="App sections"><button aria-selected="true" data-tab="home">Home</button><button aria-selected="false" data-tab="classes">Classes</button><button aria-selected="false" data-tab="register">Registration</button><button aria-selected="false" data-tab="events">Events</button><button aria-selected="false" data-tab="parents">Parents</button></nav><main id="content" aria-live="polite"></main><footer>Let's Dance Studios • Preview version</footer><script>
const pages={
home:`<section class="panel"><h2>Welcome to Let's Dance!</h2><p>Discover the joy of dance in Colorado Springs. This is an early preview of our future parent and student app.</p><a class="button" href="https://letsdancecos.com">Visit our website</a></section><section class="panel"><h2>Coming soon</h2><p>Class information, studio updates, and a convenient parent portal.</p></section>`,
classes:`<section class="panel"><h2>Explore our classes</h2><p>We offer dance opportunities for ages 2 through adult.</p><span class="pill">Intro to Dance</span><span class="pill">Tiny Tumble / Tap</span><span class="pill">Pre-Ballet / Pre-Tap</span><span class="pill">Pre-Jazz / Pre-Tap</span><span class="pill">Ballet / Tap</span><span class="pill">Adult classes</span><p class="note">Exact class times will be verified before launch.</p><a class="button" href="https://letsdancecos.com">Check studio website</a></section>`,
register:`<section class="panel"><h2>Registration</h2><p>Online registration is planned. Until it's ready, please contact the studio through its website.</p><a class="button" href="https://letsdancecos.com">Contact the studio</a></section>`,
events:`<section class="panel"><h2>Studio events</h2><p>Recital dates, holiday closures, and announcements will appear here after they're confirmed.</p></section>`,
parents:`<section class="panel"><h2>Parent portal</h2><p>Future features: secure sign-in, student information, attendance, and tuition management.</p><p class="note">No student data or payment information is collected in this preview.</p></section>`};
const content=document.getElementById('content');function show(tab){content.innerHTML=pages[tab]||pages.home;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)))}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));show('home');
</script></body></html>
