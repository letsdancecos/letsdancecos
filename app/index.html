const weekDays=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const savedTimesKey="letsdance_saved_times_v1";
let savedTimeIds=[];
try{const value=JSON.parse(localStorage.getItem(savedTimesKey)||"[]");if(Array.isArray(value))savedTimeIds=value.filter(id=>typeof id==="string"&&classTimes.some(c=>c.id===id))}catch(err){}
const timeLookup=new Map(classTimes.map(c=>[c.id,c]));
let selectedDay="All";
function timeCard(c){const selected=savedTimeIds.includes(c.id);return '<article class="class-time-card"><div><strong>'+c.name+'</strong><span>'+c.day+' · '+c.time+'</span></div><button type="button" class="save-class-btn" data-save-time="'+c.id+'" aria-pressed="'+selected+'" aria-label="'+(selected?'Remove saved time for ':'Save time for ')+c.name+', '+c.day+' '+c.time+'">'+(selected?'♥ Saved':'♡ Save Time')+'</button></article>'}
function groupedTimes(items){return weekDays.map(day=>{const group=items.filter(x=>x.day===day);return group.length?'<section class="times-day-group"><h3>'+day+'</h3>'+group.map(timeCard).join('')+'</section>':''}).join('')}
function renderClassTimes(){const root=document.getElementById('class-time-results');if(!root)return;const query=(document.getElementById('class-search')?.value||'').trim().toLowerCase();const matches=classTimes.filter(c=>(selectedDay==='All'||c.day===selectedDay)&&(!query||(c.name+' '+c.day+' '+c.time).toLowerCase().includes(query)));root.innerHTML=matches.length?groupedTimes(matches):'<p class="class-no-results">No matching class times. Try another day or search.</p>';document.getElementById('class-time-count').textContent=matches.length+' of '+classTimes.length+' weekly class-time options';document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.day===selectedDay)))}
function setupClassFinder(){const programs=document.getElementById('program-results');if(programs)programs.innerHTML=classList.map(c=>'<div class="class-card"><h3>'+c.name+'</h3><p>'+c.desc+'</p></div>').join('');selectedDay='All';const row=document.getElementById('time-day-filters');row.innerHTML=['All',...weekDays].map(d=>'<button type="button" data-day="'+d+'" aria-pressed="'+(d==='All')+'">'+(d==='All'?'All days':d.slice(0,3))+'</button>').join('');row.addEventListener('click',e=>{const btn=e.target.closest('[data-day]');if(!btn)return;selectedDay=btn.dataset.day;renderClassTimes()});const input=document.getElementById('class-search');const clear=document.getElementById('class-search-clear');input.addEventListener('input',()=>{renderClassTimes();clear.hidden=!input.value.trim()});clear.addEventListener('click',()=>{input.value='';clear.hidden=true;renderClassTimes();input.focus()});renderClassTimes()}
function persistTimes(){try{localStorage.setItem(savedTimesKey,JSON.stringify(savedTimeIds))}catch(err){}}
function sharedTimeIds(){const raw=new URLSearchParams(location.search).get('times');if(!raw||raw.length>8000)return[];return [...new Set(raw.split(',').slice(0,66))].filter(id=>timeLookup.has(id))}
function renderSharedPicks(){const el=document.getElementById('shared-picks');if(!el)return;const ids=sharedTimeIds();el.hidden=!ids.length;if(!ids.length){el.replaceChildren();return}el.innerHTML='<h3>Someone shared '+ids.length+' class '+(ids.length===1?'time':'times')+' with you 💌</h3><p>These are their favorite weekly times, not confirmed enrollment. Save them to your own device below.</p>'+groupedTimes(ids.map(id=>timeLookup.get(id)))+'<button type="button" class="primary-btn" id="save-shared-picks">💜 Save all shared times</button>'}
function renderSaved(){const root=document.getElementById('saved-results');if(!root)return;const times=savedTimeIds.map(id=>timeLookup.get(id)).filter(Boolean);root.innerHTML=times.length?'<h3>Your weekly shortlist ('+times.length+')</h3>'+groupedTimes(times):'<p class="note">No saved class times yet. Go to Classes, choose a day, and tap ♡ Save Time.</p>';for(const id of ['share-class-picks','copy-class-picks']){const btn=document.getElementById(id);if(btn)btn.disabled=!times.length}renderSharedPicks()}
function setupSavedSharing(){const feedback=document.getElementById('class-picks-feedback'),share=document.getElementById('share-class-picks'),copy=document.getElementById('copy-class-picks');function link(){const u=new URL(location.href);u.searchParams.delete('classes');u.searchParams.set('times',savedTimeIds.join(','));u.hash='';return u.href}async function copyLink(){if(!savedTimeIds.length)return;try{await navigator.clipboard.writeText(link());feedback.textContent='Times link copied. Paste it into a text or message!'}catch(e){window.prompt('Copy your class times link:',link());feedback.textContent='Copy the link above to share.'}}share.addEventListener('click',async()=>{if(!savedTimeIds.length)return;if(navigator.share){try{await navigator.share({title:"Let's Dance class times",text:"Here are the Let's Dance class times I'm considering!",url:link()});feedback.textContent='Shared your saved class times!';return}catch(e){if(e?.name==='AbortError')return}}await copyLink()});copy.addEventListener('click',copyLink)}
content.addEventListener('click',e=>{const b=e.target.closest('#save-shared-picks');if(!b)return;savedTimeIds=[...new Set([...savedTimeIds,...sharedTimeIds()])];persistTimes();renderSaved();const msg=document.getElementById('class-picks-feedback');if(msg)msg.textContent='Shared times saved on this device!'});
content.addEventListener('click',e=>{const b=e.target.closest('[data-save-time]');if(b){const id=b.dataset.saveTime;if(!timeLookup.has(id))return;savedTimeIds=savedTimeIds.includes(id)?savedTimeIds.filter(x=>x!==id):[...savedTimeIds,id];persistTimes();if(document.getElementById('class-time-results'))renderClassTimes();if(document.getElementById('saved-results'))renderSaved();return}const go=e.target.closest('[data-go]');if(go&&(document.getElementById('saved-results')||go.closest('#starting-results')))show(go.dataset.go)});
function setupRegistration(){const age=document.getElementById('reg-age'),cl=document.getElementById('reg-class'),result=document.getElementById('reg-result');age.addEventListener('change',()=>{const options=classList.filter(c=>c.group===age.value);cl.disabled=!options.length;cl.replaceChildren(new Option(options.length?'Choose a class':'Select an age group first',''),...options.map(c=>new Option(c.name,c.name)));result.replaceChildren()});document.getElementById('interest-form').addEventListener('submit',e=>{e.preventDefault();if(!age.value||!cl.value)return;result.replaceChildren();const box=document.createElement('div');box.className='reg-success';const h=document.createElement('h3');h.textContent='Enrollment preview';const p=document.createElement('p');p.textContent='You selected '+cl.value+'. In the finished app, parents will be able to send an enrollment request securely. For now, contact the studio using the link below.';const link=document.createElement('a');link.className='button';link.href='https://letsdancecos.com';link.textContent='Visit studio website';box.append(h,p,link);result.append(box)})}const eventKey="letsdance_demo_announcements_v1";let demoEvents=[];try{const saved=JSON.parse(localStorage.getItem(eventKey)||"[]");if(Array.isArray(saved))demoEvents=saved.filter(x=>x&&typeof x.title==="string").slice(0,40)}catch(e){}let eventFilter="all";function storeEvents(){try{localStorage.setItem(eventKey,JSON.stringify(demoEvents));return true}catch(e){return false}}function paintEvents(){const root=document.getElementById("event-list");if(!root)return;root.replaceChildren();document.querySelectorAll("[data-event-filter]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.eventFilter===eventFilter)));const items=demoEvents.filter(x=>eventFilter==="all"||x.category===eventFilter).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));if(!items.length){const p=document.createElement("p");p.className="note";p.textContent="No demo announcements here yet. Add one below.";root.append(p)}for(const item of items){const card=document.createElement("article");card.className="event-item";const label=document.createElement("div");label.className="event-label";label.textContent=({recital:"Recital",closure:"Closure",news:"Studio news"}[item.category]||"Studio news")+" · "+(item.date||"Date to be announced");const h=document.createElement("h3");h.textContent=item.title;const p=document.createElement("p");p.textContent=item.details||"Details coming soon";const b=document.createElement("button");b.type="button";b.className="event-remove";b.textContent="Remove demo entry";b.addEventListener("click",()=>{demoEvents=demoEvents.filter(x=>x.id!==item.id);storeEvents();paintEvents()});card.append(label,h,p,b);root.append(card)}}function setupEvents(){eventFilter="all";paintEvents();document.querySelectorAll("[data-event-filter]").forEach(b=>b.addEventListener("click",()=>{eventFilter=b.dataset.eventFilter;paintEvents()}));document.getElementById("event-form").addEventListener("submit",e=>{e.preventDefault();const title=document.getElementById("event-title").value.trim(),category=document.getElementById("event-category").value,date=document.getElementById("event-date").value,details=document.getElementById("event-details").value.trim();if(!title)return;demoEvents.push({id:String(Date.now())+Math.random(),title:title.slice(0,90),category,date,details:details.slice(0,400)});const saved=storeEvents();eventFilter="all";paintEvents();e.target.reset();document.getElementById("event-feedback").textContent=saved?"Saved on this browser only.":"Added for this session only (browser storage unavailable)."})}function setupParentHub(){
const picks=savedTimeIds.map(id=>timeLookup.get(id)).filter(Boolean);
const announcements=demoEvents.filter(x=>x&&typeof x.title==='string');
const savedCount=document.getElementById('parent-saved-count'),newsCount=document.getElementById('parent-news-count');
if(savedCount)savedCount.textContent=String(picks.length);
if(newsCount)newsCount.textContent=String(announcements.length);
function timeOrder(t){const m=t.match(/^(\d{1,2}):(\d{2})(am|pm)/i);if(!m)return 9999;return ((Number(m[1])%12)+(m[3].toLowerCase()==='pm'?12:0))*60+Number(m[2])}
const week=document.getElementById('parent-week-overview');
if(week){week.replaceChildren();if(!picks.length){const empty=document.createElement('div');empty.className='parent-hub-empty';const title=document.createElement('strong');title.textContent='Your weekly schedule starts here 💜';const desc=document.createElement('p');desc.textContent='Save a class time under Classes and it will automatically appear in your week.';const jump=document.createElement('button');jump.type='button';jump.className='primary-btn';jump.dataset.parentGo='classes';jump.textContent='Find Class Times →';empty.append(title,desc,jump);week.append(empty)}else{for(const day of weekDays){const list=picks.filter(c=>c.day===day).sort((a,b)=>timeOrder(a.time)-timeOrder(b.time));if(!list.length)continue;const group=document.createElement('section');group.className='parent-week-day';const heading=document.createElement('h3');heading.textContent=day;group.append(heading);for(const c of list){const item=document.createElement('div');item.className='parent-hub-preview-row';const title=document.createElement('strong');title.textContent=c.name;const when=document.createElement('small');when.textContent=c.time;item.append(title,when);group.append(item)}week.append(group)}}}
const events=document.getElementById('parent-announcement-preview');if(events){events.replaceChildren();const recent=announcements.slice().sort((x,y)=>(x.date||'9999').localeCompare(y.date||'9999')).slice(0,3);if(!recent.length){const p=document.createElement('p');p.className='home-empty';p.textContent='No sample announcements on this device yet. Open Events to see how announcements work.';events.append(p)}else{for(const e of recent){const item=document.createElement('article');item.className='parent-hub-announcement';const tag=document.createElement('small');tag.textContent=({recital:'Recital',closure:'Closure',news:'Studio News'}[e.category]||'Studio News')+' · '+(e.date||'Date to be announced');const title=document.createElement('strong');title.textContent=e.title.slice(0,90);const details=document.createElement('p');details.textContent=(e.details||'Details coming soon').slice(0,200);item.append(tag,title,details);events.append(item)}}}
function weekText(){return "Let's Dance Studios · My saved class times\n"+weekDays.map(day=>{const list=picks.filter(c=>c.day===day).sort((a,b)=>timeOrder(a.time)-timeOrder(b.time));return list.length?day+'\n'+list.map(c=>'• '+c.name+' · '+c.time).join('\n'):''}).filter(Boolean).join('\n\n')+"\n\nMy personal shortlist, not a registration. Please confirm times with the studio."}
const feedback=document.getElementById('parent-share-feedback'),share=document.getElementById('parent-share-week'),copy=document.getElementById('parent-copy-week');
if(share)share.disabled=!picks.length;
if(copy)copy.disabled=!picks.length;
async function copySummary(){const text=weekText();try{await navigator.clipboard.writeText(text);feedback.textContent='Schedule copied. Paste it into a text or message!'}catch(e){window.prompt('Copy your weekly schedule:',text);feedback.textContent='Use the text above to share your weekly picks.'}}
if(share)share.addEventListener('click',async()=>{if(!picks.length)return;if(navigator.share){try{await navigator.share({title:"Let's Dance: My Week",text:weekText()});feedback.textContent='Shared your weekly picks!';return}catch(e){if(e?.name==='AbortError')return}}await copySummary()});
if(copy)copy.addEventListener('click',copySummary);
document.querySelectorAll('[data-parent-go]').forEach(btn=>btn.addEventListener('click',()=>{show(btn.dataset.parentGo);if(btn.dataset.parentFocus==='dance-basics'){const target=document.getElementById('dance-basics');if(target){target.scrollIntoView({block:'start',behavior:'instant'});return}}window.scrollTo({top:0,behavior:'instant'})}));
const emailForm=document.getElementById('parent-email-form');
if(emailForm){const topic=document.getElementById('parent-email-topic'),note=document.getElementById('parent-email-message'),status=document.getElementById('parent-email-status'),copyButton=document.getElementById('parent-email-copy');
const subjects={placement:'Class placement question',schedule:'Class schedule question',saved:'Question about my saved class times',recital:'Recitals and studio events',other:'Question for the studio'};
function draft(){const key=topic.value;const subject="Let's Dance Studios: "+(subjects[key]||subjects.other);let body="Hello Let's Dance Studios,\n\n"+note.value.trim();if(key==='saved'){const list=picks.slice(0,15);if(list.length)body+="\n\nClass times I'm considering:\n"+list.map(c=>'• '+c.name+' - '+c.day+' '+c.time).join('\n')+(picks.length>15?'\nPlus '+(picks.length-15)+' more saved times.':'');else body+="\n\nI have a question about class times."}return{subject,body:body+"\n\nThank you!"}}
emailForm.addEventListener('submit',e=>{e.preventDefault();const message=draft();const url='mailto:mka1982@hotmail.com?subject='+encodeURIComponent(message.subject)+'&body='+encodeURIComponent(message.body);status.textContent='Opening your email app. Review your message and tap Send to deliver it.';window.location.href=url});
copyButton.addEventListener('click',async()=>{const message=draft();const full=message.subject+'\n\n'+message.body;try{await navigator.clipboard.writeText(full);status.textContent='Message copied. Paste it into your email app.'}catch(e){window.prompt('Copy your email message:',full);status.textContent='Copy the message above and paste it into your email app.'}})}
}
let startingPointAnswers=null;
function renderStartingPointResults(){const root=document.getElementById('starting-results');if(!root||!startingPointAnswers)return;const {age,skill}=startingPointAnswers;const beginner=skill!=='comfortable';const heading=beginner?'Begin with the fundamentals 🌱':'Let the studio confirm the level';let description=beginner?'Learning basic dance positions and other fundamentals comes first. Being older does not automatically mean being ready for pre-level classes.':'Knowing the basics is a good start, but staff should confirm readiness before selecting a class level.';if(age==='little')description+=' The website describes Introduction to dance for ages 2–3. Ask about starting points for other ages.';else if(age==='school')description+=' Ask the studio about suitable options for a school-age dancer.';else description+=' Ask the studio which Adult program fits the dancer’s experience.';root.innerHTML='<div class="starting-result-intro"><h3>'+heading+'</h3><p>'+description+'</p></div><a class="button" href="https://letsdancecos.com">Contact the studio ↗</a><button type="button" class="event-remove starting-browse" data-go="classes">Browse classes & times →</button>'}
function setupStartingPoint(){const form=document.getElementById('starting-point-form');if(!form)return;startingPointAnswers=null;form.addEventListener('submit',e=>{e.preventDefault();const age=document.getElementById('starting-age').value,skill=document.getElementById('starting-skill').value;if(!['little','school','adult'].includes(age)||!['new','learning','comfortable'].includes(skill))return;startingPointAnswers={age,skill};renderStartingPointResults()})}
const basicsPositions=[
["First Position","Heels together or close, with toes gently outward. Never force turnout."],
["Second Position","Feet apart, with space between them and toes gently outward."],
["Third Position","One foot in front, with its heel near the other foot's arch."],
["Fourth Position","One foot ahead of the other, with a little space between them."],
["Fifth Position","Feet crossed closely, with the heel of one near the toes of the other. Learn this with your teacher."]
];
let basicsCardIndex=0,basicsCardOpen=false;
function drawBasicsCard(){const box=document.getElementById('basics-flashcard');if(!box)return;const item=basicsPositions[basicsCardIndex];box.innerHTML='<span class="basics-position-number">POSITION '+(basicsCardIndex+1)+'</span><h3>'+item[0]+'</h3><p>'+(basicsCardOpen?item[1]:'Tap reveal to learn this position.')+'</p><button type="button" id="basics-reveal" aria-expanded="'+basicsCardOpen+'">'+(basicsCardOpen?'Hide answer':'Reveal position')+'</button>';document.getElementById('basics-count').textContent=(basicsCardIndex+1)+' of '+basicsPositions.length;document.getElementById('basics-back').disabled=basicsCardIndex===0;document.getElementById('basics-forward').textContent=basicsCardIndex===basicsPositions.length-1?'Start again ↻':'Next →'}
function setupBasics(){const box=document.getElementById('basics-flashcard');if(!box)return;basicsCardIndex=0;basicsCardOpen=false;drawBasicsCard();box.addEventListener('click',e=>{if(e.target.closest('#basics-reveal')){basicsCardOpen=!basicsCardOpen;drawBasicsCard()}});document.getElementById('basics-back').addEventListener('click',()=>{basicsCardIndex=Math.max(0,basicsCardIndex-1);basicsCardOpen=false;drawBasicsCard()});document.getElementById('basics-forward').addEventListener('click',()=>{basicsCardIndex=(basicsCardIndex+1)%basicsPositions.length;basicsCardOpen=false;drawBasicsCard()})}
function setupHome(){setupBasics();setupStartingPoint();document.querySelectorAll('[data-find-group]').forEach(b=>b.addEventListener('click',()=>show('classes',b.dataset.findGroup)));const appLink="https://letsdancecos.github.io/letsdancecos/app/";const shareFeedback=document.getElementById("share-feedback");const shareButton=document.getElementById("share-app");const copyButton=document.getElementById("copy-app-link");if(shareButton)shareButton.addEventListener("click",async()=>{if(navigator.share){try{await navigator.share({title:"Let's Dance Studios",text:"Explore classes and studio updates at Let's Dance Studios!",url:appLink});shareFeedback.textContent="Thanks for sharing Let's Dance!";return}catch(err){if(err&&err.name==="AbortError")return}}try{await navigator.clipboard.writeText(appLink);shareFeedback.textContent="App link copied! Paste it into a message to share."}catch(err){window.prompt("Copy this app link:",appLink);shareFeedback.textContent="Use the link above to share our app."}});if(copyButton)copyButton.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(appLink);shareFeedback.textContent="App link copied! Paste it into a message to share."}catch(err){window.prompt("Copy this app link:",appLink);shareFeedback.textContent="Use the link above to share our app."}});const button=document.getElementById("install-app");if(button){if(deferredInstallPrompt)button.hidden=false;button.addEventListener("click",async()=>{if(!deferredInstallPrompt)return;const promptEvent=deferredInstallPrompt;deferredInstallPrompt=null;button.hidden=true;await promptEvent.prompt()})}document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.go)));const root=document.getElementById("home-events");if(!root)return;root.replaceChildren();const future=demoEvents.filter(e=>e&&typeof e.title==="string"&&["recital","closure","news"].includes(e.category)).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")).slice(0,3);if(!future.length){const p=document.createElement("p");p.className="home-empty";p.textContent="No demo announcements yet. Try adding one in Events, then come back here.";root.append(p);return}for(const e of future){const card=document.createElement("article");card.className="home-preview-event";const meta=document.createElement("small");meta.textContent=({recital:"Recital",closure:"Closure",news:"Studio news"}[e.category]||"News")+" · "+(e.date||"Date TBD");const title=document.createElement("strong");title.textContent=e.title.slice(0,90);const desc=document.createElement("p");desc.className="note";desc.textContent=(e.details||"Details coming soon").slice(0,140);card.append(meta,title,desc);root.append(card)}}function show(tab,preferredFilter){content.classList.remove('page-enter');content.innerHTML=pages[tab]||pages.home;void content.offsetWidth;content.classList.add('page-enter');document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));if(tab==='classes'){setupClassFinder()}if(tab==='home')setupHome();if(tab==='saved'){renderSaved();setupSavedSharing()}if(tab==='register')setupRegistration();if(tab==='events')setupEvents();if(tab==='parents')setupParentHub()}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.tab);if(window.scrollY>80)window.scrollTo({top:0,behavior:'instant'});const nav=b.parentElement;if(nav.scrollWidth>nav.clientWidth){const target=b.offsetLeft+b.offsetWidth/2-nav.clientWidth/2;nav.scrollTo({left:Math.max(0,target),behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}}));show(sharedTimeIds().length?'saved':'home');
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js",{scope:"./"}).catch(()=>{}))}
</script></body></html>
