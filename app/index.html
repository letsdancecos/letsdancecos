d to Home Screen.</p></section>`,

parents:`<section class="panel"><h2>Parent Portal</h2><div class="demo-banner">SAMPLE ACCOUNT ONLY · No real student records or payments</div><p>See what families could access in their own secure dashboard.</p><button type="button" class="primary-btn" id="sample-open">Open sample student dashboard</button></section><section class="panel" id="sample-panel" hidden><h2>⭐ Demo Dancer</h2><p class="note">Fictional student profile</p><div class="filters"><button type="button" data-parent-section="classes">Classes</button><button type="button" data-parent-section="attendance">Attendance</button><button type="button" data-parent-section="tuition">Tuition</button></div><div id="sample-detail" aria-live="polite"></div><button type="button" class="event-remove" id="sample-close">Close dashboard</button></section>`};
const content=document.getElementById('content');const classList=[{name:"Intro to Dance",group:"little",desc:"An introduction to movement and dance."},{name:"Tiny Tumble / Tap",group:"little",desc:"Early movement, tumbling and tap."},{name:"Pre-Ballet / Pre-Tap",group:"little",desc:"Foundational ballet and tap."},{name:"Pre-Jazz / Pre-Tap",group:"little",desc:"Foundational jazz and tap."},{name:"Beginning Ballet / Tap",group:"school",desc:"Beginning ballet and tap."},{name:"Adult Ballet",group:"adult",desc:"Adult ballet classes."},{name:"Adult Tap",group:"adult",desc:"Adult tap classes."},{name:"Adult Lyrical",group:"adult",desc:"Adult lyrical dance."},{name:"Adult Pointe",group:"adult",desc:"Adult pointe classes; ask about prerequisites."}];const savedClassesKey="letsdance_saved_classes_v1";let savedClasses=[];try{const stored=JSON.parse(localStorage.getItem(savedClassesKey)||"[]");if(Array.isArray(stored))savedClasses=stored.filter(n=>Number.isInteger(n)&&n>=0&&n<classList.length)}catch(e){}let currentClassFilter="all";
function classCard(c,i){const isSaved=savedClasses.includes(i);return '<div class="class-card class-card-save"><div><h3>'+c.name+'</h3><p>'+c.desc+'</p></div><button type="button" class="save-class-btn" data-save="'+i+'" aria-pressed="'+isSaved+'" aria-label="'+(isSaved?'Remove ':'Save ')+c.name+(isSaved?' from saved classes':' to saved classes')+'">'+(isSaved?'♥ Saved':'♡ Save')+'</button></div>'}
function renderClasses(filter){currentClassFilter=filter;const out=document.getElementById('class-results');if(!out)return;const input=document.getElementById('class-search');const query=(input?.value||'').trim().toLocaleLowerCase();const matches=classList.map((c,i)=>({c,i})).filter(x=>(filter==='all'||x.c.group===filter)&&(!query||(x.c.name+' '+x.c.desc).toLocaleLowerCase().includes(query)));out.innerHTML=matches.length?matches.map(x=>classCard(x.c,x.i)).join(''):'<p class="class-no-results">No matching classes. Try another dance style or age group.</p>';const count=document.getElementById('class-search-count');if(count)count.textContent=matches.length+' '+(matches.length===1?'class':'classes')+' found';const clear=document.getElementById('class-search-clear');if(clear)clear.hidden=!query;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)))}
function setupClassFinder(){const input=document.getElementById('class-search');const clear=document.getElementById('class-search-clear');if(input)input.addEventListener('input',()=>renderClasses(currentClassFilter));if(clear)clear.addEventListener('click',()=>{if(!input)return;input.value='';renderClasses(currentClassFilter);input.focus()})}
function classSlug(name){return name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function sharedPicks(){const raw=new URLSearchParams(location.search).get('classes');if(!raw||raw.length>400)return[];const wanted=new Set(raw.split(',').slice(0,20));return classList.map((c,i)=>({c,i})).filter(x=>wanted.has(classSlug(x.c.name))).map(x=>x.i)}
function saveFavorites(){try{localStorage.setItem(savedClassesKey,JSON.stringify(savedClasses))}catch(e){}}
function renderSharedPicks(){const root=document.getElementById('shared-picks');if(!root)return;const picks=sharedPicks();root.hidden=!picks.length;if(!picks.length){root.replaceChildren();return}const count=picks.length;root.innerHTML='<h3>Someone shared '+count+' class '+(count===1?'idea':'ideas')+' with you 💌</h3><p>Here are their picks. You can save them to your own device. No sign-in needed.</p>'+picks.map(i=>classCard(classList[i],i)).join('')+'<button type="button" id="save-shared-picks" class="primary-btn">💜 Save all these classes</button>'}
function renderSaved(){const out=document.getElementById('saved-results');if(!out)return;out.innerHTML=savedClasses.length?savedClasses.map(i=>classCard(classList[i],i)).join(''):'<p class="note">No saved classes yet. Browse Classes and tap ♡ Save beside any class.</p>';for(const id of ['share-class-picks','copy-class-picks']){const btn=document.getElementById(id);if(btn)btn.disabled=!savedClasses.length}renderSharedPicks()}
function setupSavedSharing(){const feedback=document.getElementById('class-picks-feedback');const share=document.getElementById('share-class-picks');const copy=document.getElementById('copy-class-picks');function pickLink(){const u=new URL(location.href);u.searchParams.set('classes',savedClasses.map(i=>classSlug(classList[i].name)).join(','));u.hash='';return u.href}async function copyLink(){if(!savedClasses.length)return;const link=pickLink();try{await navigator.clipboard.writeText(link);feedback.textContent='Your class picks link is copied. Paste it into a text or message!'}catch(err){window.prompt('Copy your class picks link:',link);feedback.textContent='Copy the link above to share your picks.'}}if(share)share.addEventListener('click',async()=>{if(!savedClasses.length)return;const link=pickLink();if(navigator.share){try{await navigator.share({title:"Let's Dance class picks",text:"Check out these Let's Dance Studios classes!",url:link});feedback.textContent='Shared your class picks!';return}catch(err){if(err?.name==='AbortError')return}}await copyLink()});if(copy)copy.addEventListener('click',copyLink)}
content.addEventListener('click',e=>{const btn=e.target.closest('#save-shared-picks');if(!btn)return;const picks=sharedPicks();if(!picks.length)return;savedClasses=[...new Set([...savedClasses,...picks])];saveFavorites();renderSaved();const feedback=document.getElementById('class-picks-feedback');if(feedback)feedback.textContent='Shared class picks saved on this device!';});
content.addEventListener('click',e=>{const btn=e.target.closest('[data-save]');if(btn){const i=Number(btn.dataset.save);if(!Number.isInteger(i)||i<0||i>=classList.length)return;savedClasses=savedClasses.includes(i)?savedClasses.filter(n=>n!==i):[...savedClasses,i];try{localStorage.setItem(savedClassesKey,JSON.stringify(savedClasses))}catch(err){}if(document.getElementById('class-results'))renderClasses(currentClassFilter);if(document.getElementById('saved-results'))renderSaved();if(document.getElementById('starting-results'))renderStartingPointResults();return}const go=e.target.closest('[data-go]');if(go&&(document.getElementById('saved-results')||document.getElementById('starting-results')))show(go.dataset.go)});
function setupRegistration(){const age=document.getElementById('reg-age'),cl=document.getElementById('reg-class'),result=document.getElementById('reg-result');age.addEventListener('change',()=>{const options=classList.filter(c=>c.group===age.value);cl.disabled=!options.length;cl.replaceChildren(new Option(options.length?'Choose a class':'Select an age group first',''),...options.map(c=>new Option(c.name,c.name)));result.replaceChildren()});document.getElementById('interest-form').addEventListener('submit',e=>{e.preventDefault();if(!age.value||!cl.value)return;result.replaceChildren();const box=document.createElement('div');box.className='reg-success';const h=document.createElement('h3');h.textContent='Enrollment preview';const p=document.createElement('p');p.textContent='You selected '+cl.value+'. In the finished app, parents will be able to send an enrollment request securely. For now, contact the studio using the link below.';const link=document.createElement('a');link.className='button';link.href='https://letsdancecos.com';link.textContent='Visit studio website';box.append(h,p,link);result.append(box)})}const eventKey="letsdance_demo_announcements_v1";let demoEvents=[];try{const saved=JSON.parse(localStorage.getItem(eventKey)||"[]");if(Array.isArray(saved))demoEvents=saved.filter(x=>x&&typeof x.title==="string").slice(0,40)}catch(e){}let eventFilter="all";function storeEvents(){try{localStorage.setItem(eventKey,JSON.stringify(demoEvents));return true}catch(e){return false}}function paintEvents(){const root=document.getElementById("event-list");if(!root)return;root.replaceChildren();document.querySelectorAll("[data-event-filter]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.eventFilter===eventFilter)));const items=demoEvents.filter(x=>eventFilter==="all"||x.category===eventFilter).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));if(!items.length){const p=document.createElement("p");p.className="note";p.textContent="No demo announcements here yet. Add one below.";root.append(p)}for(const item of items){const card=document.createElement("article");card.className="event-item";const label=document.createElement("div");label.className="event-label";label.textContent=({recital:"Recital",closure:"Closure",news:"Studio news"}[item.category]||"Studio news")+" · "+(item.date||"Date to be announced");const h=document.createElement("h3");h.textContent=item.title;const p=document.createElement("p");p.textContent=item.details||"Details coming soon";const b=document.createElement("button");b.type="button";b.className="event-remove";b.textContent="Remove demo entry";b.addEventListener("click",()=>{demoEvents=demoEvents.filter(x=>x.id!==item.id);storeEvents();paintEvents()});card.append(label,h,p,b);root.append(card)}}function setupEvents(){eventFilter="all";paintEvents();document.querySelectorAll("[data-event-filter]").forEach(b=>b.addEventListener("click",()=>{eventFilter=b.dataset.eventFilter;paintEvents()}));document.getElementById("event-form").addEventListener("submit",e=>{e.preventDefault();const title=document.getElementById("event-title").value.trim(),category=document.getElementById("event-category").value,date=document.getElementById("event-date").value,details=document.getElementById("event-details").value.trim();if(!title)return;demoEvents.push({id:String(Date.now())+Math.random(),title:title.slice(0,90),category,date,details:details.slice(0,400)});const saved=storeEvents();eventFilter="all";paintEvents();e.target.reset();document.getElementById("event-feedback").textContent=saved?"Saved on this browser only.":"Added for this session only (browser storage unavailable)."})}const sampleViews={classes:"<h3>Class enrollment</h3><p>Pre-Ballet / Pre-Tap (sample)</p><p>Schedule: Contact studio to confirm</p>",attendance:"<h3>Attendance</h3><p>3 of 4 classes attended (sample)</p><p>✓ Present · ✓ Present · Absent · ✓ Present</p>",tuition:"<h3>Tuition</h3><p>Example invoice status: Paid</p><p>No real invoices, cards, or balances are connected.</p>"};function setupParentDemo(){const panel=document.getElementById("sample-panel");const detail=document.getElementById("sample-detail");function select(name){detail.innerHTML="<div class=\"sample-info\">"+sampleViews[name]+"</div>";document.querySelectorAll("[data-parent-section]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.parentSection===name)))}document.getElementById("sample-open").addEventListener("click",()=>{panel.hidden=false;select("classes");panel.scrollIntoView({block:"start",behavior:"smooth"})});document.getElementById("sample-close").addEventListener("click",()=>{panel.hidden=true});document.querySelectorAll("[data-parent-section]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.parentSection)))}let startingPointAnswers=null;
function renderStartingPointResults(){const root=document.getElementById('starting-results');if(!root||!startingPointAnswers)return;const {age,skill}=startingPointAnswers;const beginner=skill!=='comfortable';let indices=[],heading='Classes to explore',description='';
if(beginner){heading='Begin with the basics 🌱';description='Learning dance positions and other foundations comes first. Talk to the studio about the right starting class.';if(age==='little')indices=[0];else if(age==='school')indices=[4];}
else{description='Here are classes to explore in this age group. The teacher will check readiness before placing a dancer.';indices=classList.map((c,i)=>({c,i})).filter(x=>x.c.group===age).slice(0,4).map(x=>x.i);}
const title='<div class="starting-result-intro"><h3>'+heading+'</h3><p>'+description+'</p></div>';
if(!indices.length){root.innerHTML=title+'<p>Ask the studio which adult class is appropriate for learning the basic positions.</p><a class="button" href="https://letsdancecos.com">Contact the studio ↗</a>';return}
root.innerHTML=title+indices.map(i=>classCard(classList[i],i)).join('')+'<p class="note">Options to discuss, not confirmed class placements.</p><button type="button" class="event-remove starting-browse" data-go="classes">Browse all classes →</button>'}
function setupStartingPoint(){const form=document.getElementById('starting-point-form');if(!form)return;startingPointAnswers=null;form.addEventListener('submit',e=>{e.preventDefault();const age=document.getElementById('starting-age').value,skill=document.getElementById('starting-skill').value;if(!['little','school','adult'].includes(age)||!['new','learning','comfortable'].includes(skill))return;startingPointAnswers={age,skill};renderStartingPointResults()})}
function setupHome(){setupStartingPoint();document.querySelectorAll('[data-find-group]').forEach(b=>b.addEventListener('click',()=>show('classes',b.dataset.findGroup)));const appLink="https://letsdancecos.github.io/letsdancecos/app/";const shareFeedback=document.getElementById("share-feedback");const shareButton=document.getElementById("share-app");const copyButton=document.getElementById("copy-app-link");if(shareButton)shareButton.addEventListener("click",async()=>{if(navigator.share){try{await navigator.share({title:"Let's Dance Studios",text:"Explore classes and studio updates at Let's Dance Studios!",url:appLink});shareFeedback.textContent="Thanks for sharing Let's Dance!";return}catch(err){if(err&&err.name==="AbortError")return}}try{await navigator.clipboard.writeText(appLink);shareFeedback.textContent="App link copied! Paste it into a message to share."}catch(err){window.prompt("Copy this app link:",appLink);shareFeedback.textContent="Use the link above to share our app."}});if(copyButton)copyButton.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(appLink);shareFeedback.textContent="App link copied! Paste it into a message to share."}catch(err){window.prompt("Copy this app link:",appLink);shareFeedback.textContent="Use the link above to share our app."}});const button=document.getElementById("install-app");if(button){if(deferredInstallPrompt)button.hidden=false;button.addEventListener("click",async()=>{if(!deferredInstallPrompt)return;const promptEvent=deferredInstallPrompt;deferredInstallPrompt=null;button.hidden=true;await promptEvent.prompt()})}document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.go)));const root=document.getElementById("home-events");if(!root)return;root.replaceChildren();const future=demoEvents.filter(e=>e&&typeof e.title==="string"&&["recital","closure","news"].includes(e.category)).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")).slice(0,3);if(!future.length){const p=document.createElement("p");p.className="home-empty";p.textContent="No demo announcements yet. Try adding one in Events, then come back here.";root.append(p);return}for(const e of future){const card=document.createElement("article");card.className="home-preview-event";const meta=document.createElement("small");meta.textContent=({recital:"Recital",closure:"Closure",news:"Studio news"}[e.category]||"News")+" · "+(e.date||"Date TBD");const title=document.createElement("strong");title.textContent=e.title.slice(0,90);const desc=document.createElement("p");desc.className="note";desc.textContent=(e.details||"Details coming soon").slice(0,140);card.append(meta,title,desc);root.append(card)}}function show(tab,preferredFilter){content.classList.remove('page-enter');content.innerHTML=pages[tab]||pages.home;void content.offsetWidth;content.classList.add('page-enter');document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));if(tab==='classes'){renderClasses(preferredFilter||'all');setupClassFinder();document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>renderClasses(b.dataset.filter)))}if(tab==='home')setupHome();if(tab==='saved'){renderSaved();setupSavedSharing()}if(tab==='register')setupRegistration();if(tab==='events')setupEvents();if(tab==='parents')setupParentDemo()}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.tab);if(window.scrollY>80)window.scrollTo({top:0,behavior:'instant'});const nav=b.parentElement;if(nav.scrollWidth>nav.clientWidth){const target=b.offsetLeft+b.offsetWidth/2-nav.clientWidth/2;nav.scrollTo({left:Math.max(0,target),behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}}));show(sharedPicks().length?'saved':'home');
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js",{scope:"./"}).catch(()=>{}))}
</script></body></html>
